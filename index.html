<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Sendglass</title>
    <script>
      // Apply the saved theme before first paint (mirrored from IndexedDB by the settings repo).
      // Keep the key in sync with THEME_KEY in src/storage/settingsMirror.ts.
      try {
        var theme = localStorage.getItem("sendglass.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
